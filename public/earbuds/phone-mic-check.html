<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telepath phone mic check</title>
  <link rel="stylesheet" href="/phone.css">
</head>
<body>
  <main class="app"><section class="screen">
    <h1 class="display">Phone mic + AirPods</h1>
    <p>Start the sound and try an AirPods gesture. Then choose the built-in iPhone microphone and repeat.</p>
    <audio id="route-audio" loop playsinline preload="auto" src="./airpods-1/playback.mp3"></audio>
    <button id="route-play" class="primary" type="button">Start playback</button>
    <button id="route-list" type="button">Find microphone inputs</button>
    <label class="field"><span>Microphone input</span><select id="route-device" disabled></select></label>
    <button id="route-mic" type="button" disabled>Start selected mic</button>
    <button id="route-stop" type="button" hidden>Stop mic</button>
    <p class="meta" id="route-status" role="status">Microphone off.</p>
    <p id="route-events" aria-live="polite">Playback only: 0 · While mic active: 0</p>
    <p class="meta" id="route-last"></p>
    <p class="fineprint">This check sends no microphone audio to Telepath.</p>
  </section></main>
  <script type="module" src="./phone-mic-check.mjs"></script>
</body>
</html>
